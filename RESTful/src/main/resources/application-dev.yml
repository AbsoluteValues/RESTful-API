spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql9:3306/restful?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: restful
    password:

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true



logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: trace
