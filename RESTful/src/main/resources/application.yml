spring:
  application:
    name: RESTful

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    open-in-view: false

  profiles:
    active: local



server:
  port: 8080



jwt:
  private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:./secrets/jwt-private.pem}
  public-key-locations: ${JWT_PUBLIC_KEY_LOCATIONS:file:./secrets/jwt-public.pem}
  public-key-ids: ${JWT_PUBLIC_KEY_IDS:${JWT_KEY_ID}}
  key-id: ${JWT_KEY_ID}
  issuer: ${JWT_ISSUER:RESTful}
  audience: ${JWT_AUDIENCE:RESTful-api}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
