spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql9:3306/restful?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: restful
    password:



springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false



logging:
  file:
    name: /logs/prod-server.log
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: off



management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: RESTful