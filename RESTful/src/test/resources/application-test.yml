spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: test
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  public-key-ids: test-key-1,test-key-0
  key-id: test-key-1
  issuer: RESTful-test
  audience: RESTful-api-test
  access-token-expiration: 15m
  refresh-token-expiration: 14d

security:
  cors:
    allowed-origins: http://localhost:3000
